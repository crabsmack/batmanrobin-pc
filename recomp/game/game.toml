# game.toml - The Adventures of Batman and Robin (Sega Genesis), SHA-1 1da4b3fc92a6572e70d748ebad346aeb291f89f3.
# Written by `dkit genesis recomp init`; yours to edit (`recomp sync` rewrites only the
# discovery files). Discovery is the byte-matching disassembly, never runtime feedback:
# `dkit genesis recomp sync` copies its handoff (`dkit disasm handoff`) here:
#   code_addrs.txt     every instruction start (runtime-verified)
#   seeds.toml         every function entry (one src/f file each)
#   labels.toml        interior code labels (CFG seeds; exact-mode computed-JMP cases)
#   plugin_seeds.toml  entries the disasm plugins know (mpw_a5: the A5 jump-table stubs)
# Vectors: SSP $00000000, entry $000300, IRQ4 $FFE560, IRQ6 $007736 (spec.c).

[game]
output_prefix = "batmanrobin"
code_addrs_file = "code_addrs.txt"
discovery_files = ["seeds.toml", "labels.toml", "ram_code.toml"]
# A 68000: never generate a 68020 path (MPW's math routines test for one and branch past it).
allow_68020_branch = false
jump_table_autodiscovery = false
# Cycle-exact emission: the runner schedules the 68000, VDP, Z80 and interrupts like the
# reference emulator (the engine's exact scheduler). Phase 2's criteria compare every frame.
exact_timing = true
# Phase 4 turns on XENTRY at every function entry (logical positions, sync points).
entry_hooks = true

# Per-game RAM layout: only the stack fields are load-bearing here.
[ram_layout]
game_mode      = 0x000000
vint_runcount  = 0x000000
vint_routine   = 0x000000
plc_pending    = 0x000000
initial_ssp    = 0x00000000
vbla_stack     = 0x00000000
intr_stack     = 0x00000000
player_object  = 0x000000
level_modes    = []

[functions]
extra = [0x000300, 0x007736, 0xFFE560]
blacklist = []

# --- dkit: phase-4 wait sites (generated by `dkit genesis recomp sync` from dkit.toml [recomp.sync]) ---
[[widescreen_site]]
addr = 0x009C14   # a wait loop's backward branch
kind = "game_hook"

[[widescreen_site]]
addr = 0x009C48   # a wait loop's backward branch
kind = "game_hook"

[[widescreen_site]]
addr = 0x009C98   # a wait loop's backward branch
kind = "game_hook"

[[widescreen_site]]
addr = 0x009CB0   # a wait loop's backward branch
kind = "game_hook"

[[widescreen_site]]
addr = 0x009CBA   # a wait loop's backward branch (a wait at its loop-back 2 in a row)
kind = "game_hook"

[[widescreen_site]]
addr = 0x009CC0   # a wait loop's backward branch
kind = "game_hook"

